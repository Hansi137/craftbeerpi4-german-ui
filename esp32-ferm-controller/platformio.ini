; PlatformIO-Projektkonfiguration für den ESP32-Gärschrank-Controller.
;
; Getestet/verifiziert wurde dieses Projekt in der Entwicklungsumgebung
; tatsächlich über Arduino CLI (siehe README.md, Abschnitt "Verifikation") -
; die src/-Ordnerstruktur ist aber bereits die PlatformIO-Standardstruktur
; und braucht dafür keine Anpassung, beide Werkzeuge nutzen denselben Code.

[env:esp32s3]
platform = espressif32
; ESP32-S3 (Board mit eingebautem 170x320-Display, z.B. LilyGo T-Display-S3
; o.ä.) - "esp32-s3-devkitc-1" ist die generische PlatformIO-Board-ID dafür,
; funktioniert unabhängig vom genauen Hersteller-Board, solange die
; Pin-Belegung in src/config.h stimmt.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    lacamera/ESPAsyncWebServer @ ^3.1.0
    bblanchon/ArduinoJson @ ^7.4.3
    milesburton/DallasTemperature @ ^4.0.6
    paulstoffregen/OneWire @ ^2.3.8

; Host-seitige Logik-Tests (keine ESP32-Hardware nötig), siehe test/.
; Ausführen mit: pio test -e native
[env:native]
platform = native
test_filter = test_cooling_control, test_schedule
build_flags = -std=c++14
