; PlatformIO-Projektkonfiguration für den ESP32-Gärschrank-Controller.
;
; Getestet/verifiziert wurde dieses Projekt in der Entwicklungsumgebung
; tatsächlich über Arduino CLI (siehe README.md, Abschnitt "Verifikation") -
; die src/-Ordnerstruktur ist aber bereits die PlatformIO-Standardstruktur
; und braucht dafür keine Anpassung, beide Werkzeuge nutzen denselben Code.

[env:esp32s3]
platform = espressif32
; ESP32-S3 (Board mit eingebautem 170x320-Display, z.B. LilyGo T-Display-S3
; o.ä.) - "esp32-s3-devkitc-1" ist die generische PlatformIO-Board-ID dafür,
; funktioniert unabhängig vom genauen Hersteller-Board, solange die
; Pin-Belegung in src/config.h stimmt.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; WICHTIG: Dieses Board hat natives USB (der USB-C-Port liegt direkt am
; Chip, nicht an einem separaten UART-Brücken-Chip). Ohne diese beiden
; Flags bleibt Serial.print() stumm - live am Gerät verifiziert: ohne
; ARDUINO_USB_CDC_ON_BOOT=1 kam über das USB-Kabel absolut keine
; Serial-Ausgabe an, mit aktiviertem Flag liefen alle 28 Selbsttests
; sichtbar durch. Entspricht der Arduino-IDE/CLI-Boardoption
; "USB CDC On Boot: Enabled".
; Eingebautes Display (ST7789, 170x320, 8-Bit Parallel) - entspricht 1:1
; TFT_eSPI's mitgelieferter "Setup206_LilyGo_T_Display_S3.h". Hier direkt
; als Build-Flags statt die Library-Datei User_Setup_Select.h anzufassen,
; damit PlatformIO-Nutzer nichts manuell in der installierten Bibliothek
; konfigurieren müssen (bei Arduino IDE/CLI ist das leider nötig, siehe
; README.md, Abschnitt "Firmware flashen").
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    lacamera/ESPAsyncWebServer @ ^3.1.0
    bblanchon/ArduinoJson @ ^7.4.3
    milesburton/DallasTemperature @ ^4.0.6
    paulstoffregen/OneWire @ ^2.3.8
    bodmer/TFT_eSPI @ ^2.5.43

; Host-seitige Logik-Tests (keine ESP32-Hardware nötig), siehe test/.
; Ausführen mit: pio test -e native
[env:native]
platform = native
test_filter = test_cooling_control, test_schedule
build_flags = -std=c++14
